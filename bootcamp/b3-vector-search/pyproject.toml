[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "investment-vector-search"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "pydantic",
    "pypdf",
    "sentence-transformers"
]


[tool.setuptools]
packages = ["vector_search"]